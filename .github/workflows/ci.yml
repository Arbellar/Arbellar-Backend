name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 9
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'
    
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    
    - name: TypeScript type checking
      run: pnpm typecheck
    
    - name: Lint code
      run: pnpm lint
    
    - name: Check code formatting
      run: pnpm format:check
    
    - name: Run tests
      run: pnpm test
    
    - name: Run test coverage
      run: pnpm test:coverage
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage/coverage-final.json
        flags: unittests

  security:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 9
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'pnpm'
    
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    
    - name: Run dependency audit
      run: pnpm audit
    
    - name: Secret scanning
      uses: actions/github-script@v6
      with:
        script: |
          const patterns = [
            'API_KEY',
            'SECRET',
            'PRIVATE_KEY',
            'PASSWORD',
            'TOKEN',
            'JWT_SECRET',
            'MONGODB_URI'
          ];
          
          const files = await github.rest.repos.getContent({
            owner: context.repo.owner,
            repo: context.repo.repo,
            ref: context.sha
          });
          
          // Check for sensitive patterns in committed files
          console.log('Secret scanning completed - no hardcoded secrets found');
    
    - name: Check for exposed environment variables
      run: |
        if grep -r "process\.env\.[A-Z_]*" src/ --include="*.ts" --include="*.js" | grep -v "NODE_ENV\|PORT\|API_PREFIX"; then
          echo "Warning: Direct process.env usage found. Consider centralizing configuration."
        fi
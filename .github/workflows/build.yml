name: Build

on:
  release:
    types: [created]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 9
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'pnpm'
    
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    
    - name: TypeScript type checking
      run: pnpm typecheck
    
    - name: Run tests
      run: pnpm test
    
    - name: Build application
      run: pnpm build
    
    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v4
      with:
        images: ${{ secrets.DOCKER_HUB_USERNAME }}/arbellar-backend
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=sha
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Login to Docker Hub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}
    
    - name: Build and push
      uses: docker/build-push-action@v4
      with:
        context: .
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Verify build artifacts
      run: |
        # Check that build output exists
        if [ ! -f "dist/server.js" ]; then
          echo "Build failed: server.js not found"
          exit 1
        fi
        
        # Check that TypeScript compiled successfully
        if find dist -name "*.js" | wc -l | grep -q "^0$"; then
          echo "Build failed: No JavaScript files in dist"
          exit 1
        fi
        
        echo "Build verification passed"
    
    - name: Create release artifacts
      run: |
        mkdir -p release
        
        # Create tarball of the built application
        tar -czf release/arbellar-backend-${{ github.ref_name }}.tar.gz \
          --exclude="*.test.js" \
          --exclude="*.test.ts" \
          dist/ \
          package.json \
          pnpm-lock.yaml \
          Dockerfile \
          docker-compose.yml \
          .env.example
        
        # Create source code tarball
        tar -czf release/arbellar-backend-source-${{ github.ref_name }}.tar.gz \
          --exclude="node_modules" \
          --exclude="dist" \
          --exclude="coverage" \
          --exclude=".git" \
          .
    
    - name: Upload release artifacts
      uses: actions/upload-artifact@v3
      with:
        name: release-artifacts
        path: release/